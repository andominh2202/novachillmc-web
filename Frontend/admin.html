<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="./assets/images/favicon.png">
  <title>NovaChillMC - Quản lý</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/home.css" />
  <link rel="stylesheet" href="./css/admin.css" />
</head>
<body>
  <header class="site-header">
    <a href="./index.html" class="brand">
      <div class="brand-icon">◈</div>
      <span>NOVA<span>CHILL</span>MC</span>
    </a>

    <nav class="nav">
      <a href="./index.html">⌂ Trang chủ</a>
      <a href="./index.html#features">✧ Tính năng</a>
      <a href="./gallery.html">▧ Hình ảnh</a>
      <a href="./rules.html">⚖ Luật server</a>
      <a href="./register.html">✎ Đăng ký</a>
      <a class="active" href="./admin.html">✥ Quản lý</a>
    </nav>
  </header>

  <main class="admin-page">
    <section class="admin-top">
      <div>
        <div class="pill">◆ ADMIN PANEL</div>
        <h1>Quản lý player</h1>
      </div>

      <div class="count-box">
        <span>Tổng player</span>
        <strong id="totalPlayers">0</strong>
      </div>
    </section>

    <section class="admin-layout">
      <form id="addPlayerForm" class="admin-card">
        <h2>Thêm player</h2>

        <input id="adminIngame" type="text" placeholder="Tên ingame" required>
        <input id="adminFacebook" type="text" placeholder="Tên Facebook" required>

        <select id="adminPlatform" required>
          <option value="">Chọn nền tảng</option>
          <option value="Bedrock">PE / Bedrock</option>
          <option value="Java">PC / Java</option>
        </select>

        <textarea id="adminNote" rows="4" placeholder="Ghi chú"></textarea>

        <button type="submit">THÊM PLAYER</button>
      </form>

      <section class="admin-card">
        <h2>Danh sách player</h2>

        <div class="admin-filters">
          <input id="searchInput" type="text" placeholder="Tìm ingame / Facebook">

          <select id="platformFilter">
            <option value="">Tất cả nền tảng</option>
            <option value="Bedrock">PE / Bedrock</option>
            <option value="Java">PC / Java</option>
          </select>

          <input id="fromDate" type="date">
          <input id="toDate" type="date">

          <select id="sortSelect">
            <option value="newest">Mới nhất</option>
            <option value="oldest">Cũ nhất</option>
          </select>

          <button id="filterBtn" type="button">TÌM</button>
          <button id="resetFilterBtn" type="button">RESET</button>
        </div>

        <div id="playerList" class="player-list"></div>
      </section>
    </section>
  </main>

  <!-- ADMIN LOGIN MODAL -->
  <div id="admin-modal" class="admin-modal">
    <div class="admin-box">
      <div class="admin-lock">🔐</div>

      <h2>NovaChillMC Admin</h2>

      <p>
        Nhập khóa quản trị để truy cập bảng điều khiển
      </p>

      <input
        type="password"
        id="admin-password"
        placeholder="Nhập admin key..."
      >

      <button id="admin-login-btn">
        Truy cập quản trị
      </button>
    </div>
  </div>

  <!-- EDIT PLAYER MODAL -->
  <div id="edit-modal" class="admin-modal edit-modal">
    <div class="admin-box edit-box">
      <div class="admin-lock">✎</div>

      <h2>Sửa player</h2>

      <form id="editPlayerForm">
        <input id="editPlayerId" type="hidden">

        <input id="editIngame" type="text" placeholder="Tên ingame" required>
        <input id="editFacebook" type="text" placeholder="Tên Facebook" required>

        <select id="editPlatform" required>
          <option value="Bedrock">PE / Bedrock</option>
          <option value="Java">PC / Java</option>
        </select>

        <textarea id="editNote" rows="4" placeholder="Ghi chú"></textarea>

        <button type="submit">LƯU THAY ĐỔI</button>
        <button id="closeEditBtn" type="button">HỦY</button>
      </form>
    </div>
  </div>

  <script src="./js/config.js?v=5"></script>
  <script src="./js/admin.js?v=5"></script>
</body>
</html>
